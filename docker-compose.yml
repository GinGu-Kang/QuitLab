services:
  db:
    image: postgres:16-alpine
    container_name: quit-codex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - quit-codex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quit-codex-postgres-data:
